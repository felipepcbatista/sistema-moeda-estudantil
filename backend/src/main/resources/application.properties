spring.application.name=moeda-estudantil

# O Render informa a porta pela variavel PORT; localmente, 8080
server.port=${PORT:8080}

# Localmente, o PostgreSQL do docker-compose. No Render, host/porta/banco/usuario/senha vem do banco gerenciado (render.yaml)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:moeda_estudantil}}
spring.datasource.username=${DB_USER:moeda}
spring.datasource.password=${DB_PASSWORD:moeda}

# O schema e versionado pelo Flyway (db/migration); o Hibernate so confere se as entidades batem com ele
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (US01): chave HS256 de no minimo 32 bytes; em producao, sempre via variavel de ambiente
app.jwt.segredo=${JWT_SEGREDO:dev-somente-local-troque-em-producao-0123456789}
app.jwt.validade-horas=8

# Email (RN06, RN10). Provedor "smtp": Mailpit do docker-compose (caixa em http://localhost:8025).
# Provedor "mailtrap": API HTTP, usada na nuvem porque o Render gratuito bloqueia as portas SMTP.
app.mail.provedor=${MAIL_PROVEDOR:smtp}
app.mail.remetente=${MAIL_REMETENTE:nao-responda@moedaestudantil.local}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
app.mail.mailtrap.url=${MAILTRAP_URL:}
app.mail.mailtrap.token=${MAILTRAP_TOKEN:}

# Fotos das vantagens (RN08): gravadas no banco (tabela foto), servidas por /api/fotos/{arquivo}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
