spring.application.name=moeda-estudantil

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/moeda_estudantil}
spring.datasource.username=${DB_USER:moeda}
spring.datasource.password=${DB_PASSWORD:moeda}

# O schema e versionado pelo Flyway (db/migration); o Hibernate so confere se as entidades batem com ele
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
