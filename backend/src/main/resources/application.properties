spring.application.name=moeda-estudantil

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/moeda_estudantil}
spring.datasource.username=${DB_USER:moeda}
spring.datasource.password=${DB_PASSWORD:moeda}

# O schema e versionado pelo Flyway (db/migration); o Hibernate so confere se as entidades batem com ele
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (US01): chave HS256 de no minimo 32 bytes; em producao, sempre via variavel de ambiente
app.jwt.segredo=${JWT_SEGREDO:dev-somente-local-troque-em-producao-0123456789}
app.jwt.validade-horas=8

# Email (RN06, RN10): em desenvolvimento, o Mailpit do docker-compose (caixa em http://localhost:8025)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
app.mail.remetente=nao-responda@moedaestudantil.local

# Fotos das vantagens (RN08): gravadas em disco, servidas por /api/fotos/{arquivo}
app.fotos.dir=${FOTOS_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
