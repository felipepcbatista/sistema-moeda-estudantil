services:
  postgres:
    image: postgres:16-alpine
    container_name: moeda-estudantil-db
    environment:
      POSTGRES_DB: moeda_estudantil
      POSTGRES_USER: moeda
      POSTGRES_PASSWORD: moeda
    ports:
      # porta 5434 no host para nao colidir com um PostgreSQL local na 5432
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Servidor SMTP de desenvolvimento: recebe os emails do sistema e mostra numa caixa de entrada web
  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: moeda-estudantil-mail
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # caixa de entrada: http://localhost:8025

volumes:
  pgdata:
